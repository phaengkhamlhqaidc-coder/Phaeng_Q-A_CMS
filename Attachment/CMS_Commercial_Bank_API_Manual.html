<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Commercial Bank API — Technical Handbook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@100;300;400;500;600;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Lao','Inter','Segoe UI',system-ui,sans-serif}
:root{
  --sidebar-w:290px;
  --accent:#0E7C66;
  --accent-2:#1D9E75;
  --accent-bg:#E1F5EE;
  --accent-dark:#064B3D;
  --border:#e5e7eb;
  --text:#0f172a;
  --text-muted:#64748b;
  --bg:#f6f8f9;
  --white:#ffffff;
  --code-bg:#0f1f1c;
  --code-text:#d6f5e9;
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
}
code,pre,.mono{font-family:'JetBrains Mono','Noto Sans Lao',monospace}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}

.header{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.25rem;height:60px;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-logo{display:flex;align-items:center;gap:11px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent-2),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-icon i{font-size:20px;color:#fff}
.logo-text h1{font-size:15px;font-weight:700;color:var(--text);line-height:1.2}
.logo-text p{font-size:11.5px;color:var(--text-muted)}
.header-search{flex:1;max-width:340px;margin:0 auto;position:relative}
.header-search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:var(--bg);color:var(--text);outline:none}
.header-search input:focus{border-color:var(--accent-2);background:var(--white)}
.header-search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-shrink:0}
.lang-toggle button{border:none;background:var(--white);color:var(--text-muted);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.lang-toggle button.active{background:var(--accent);color:#fff}

.app-body{display:flex;flex:1;height:calc(100vh - 60px)}
.sidebar{width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:.75rem 0}
.sidebar-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;padding:10px 18px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 18px;cursor:pointer;font-size:13px;color:var(--text-muted);transition:all .15s;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent-dark);font-weight:600;border-left-color:var(--accent)}
.nav-item i{font-size:17px;flex-shrink:0;width:20px;text-align:center}

.main{flex:1;overflow-y:auto;padding:1.75rem 2rem;max-width:100%}
.section-header{margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:1rem}
.breadcrumb{font-size:12px;color:var(--text-muted);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.breadcrumb i{font-size:13px}
.section-header h2{font-size:23px;font-weight:700;color:var(--text);margin-bottom:5px}
.section-header p{font-size:13.5px;color:var(--text-muted)}

.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ov-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.1rem;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:9px}
.ov-card:hover{border-color:var(--accent-2);box-shadow:0 6px 18px rgba(14,124,102,.13);transform:translateY(-2px)}
.ov-icon{width:42px;height:42px;border-radius:11px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center}
.ov-icon i{font-size:21px;color:var(--accent)}
.ov-card h3{font-size:13.5px;font-weight:700;color:var(--text)}
.ov-card p{font-size:12px;color:var(--text-muted);line-height:1.55}

.content-block{margin-bottom:1.1rem;max-width:920px}
.content-block h3.blk{font-size:16px;font-weight:700;color:var(--accent-dark);margin:1.4rem 0 .6rem;display:flex;align-items:center;gap:8px}
.content-block h3.blk::before{content:"";width:4px;height:18px;background:var(--accent-2);border-radius:3px}
.content-block p.blk{font-size:14px;line-height:1.75;color:#334155;margin-bottom:.5rem}
ul.blk{margin:.3rem 0 .6rem;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:7px}
ul.blk li{font-size:13.5px;line-height:1.65;color:#334155;padding-left:24px;position:relative}
ul.blk li::before{content:"\2713";position:absolute;left:0;top:0;color:var(--accent-2);font-weight:700}

.note{background:#FFF8E6;border:1px solid #F5E6B8;border-left:4px solid #E0A82E;border-radius:8px;padding:11px 14px;font-size:13px;line-height:1.65;color:#5c4708;margin:.6rem 0;display:flex;gap:9px;max-width:920px}
.note i{color:#E0A82E;font-size:17px;flex-shrink:0;margin-top:1px}

.flow{display:flex;flex-direction:column;gap:0;margin:.6rem 0 1rem;max-width:920px}
.flow-step{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--accent-2);border-radius:9px;padding:11px 15px;font-size:13.5px;line-height:1.6;color:#334155;display:flex;gap:11px;align-items:flex-start}
.flow-num{background:var(--accent);color:#fff;width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
.flow-arrow{text-align:center;color:var(--accent-2);font-size:18px;line-height:1;margin:3px 0}

table.tbl{width:100%;max-width:920px;border-collapse:collapse;margin:.5rem 0 1rem;background:var(--white);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
table.tbl thead{background:var(--accent);color:#fff}
table.tbl th{text-align:left;padding:10px 13px;font-weight:600;font-size:12.5px}
table.tbl td{padding:9px 13px;border-top:1px solid var(--border);color:#334155;line-height:1.5;vertical-align:top}
table.tbl tbody tr:nth-child(even){background:#fafcfb}
table.tbl tbody tr:hover{background:var(--accent-bg)}
table.tbl td:first-child{font-weight:500}

pre.code{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:15px 17px;overflow-x:auto;font-size:12.5px;line-height:1.6;margin:.5rem 0 1rem;max-width:920px;position:relative;border:1px solid #1c322d}
pre.code .k{color:#7fd8c0}
.copy-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.1);border:none;color:#a8e6d2;font-size:11px;padding:4px 9px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif}
.copy-btn:hover{background:rgba(255,255,255,.2)}
.code-wrap{position:relative;max-width:920px}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:60px;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 16px rgba(0,0,0,.1)}
  .sidebar.open{transform:translateX(0)}
  .header-search{display:none}
  .main{padding:1.25rem}
  .menu-btn{display:flex!important}
}
.menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:19px}
</style>
</head>
<body>

<header class="header">
  <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="ti ti-menu-2"></i></button>
  <div class="header-logo">
    <div class="logo-icon"><i class="ti ti-building-bank"></i></div>
    <div class="logo-text">
      <h1 id="docTitle"></h1>
      <p id="docSubtitle"></p>
    </div>
  </div>
  <div class="header-search">
    <i class="ti ti-search"></i>
    <input type="text" id="searchInput" oninput="handleSearch(this.value)">
  </div>
  <div class="lang-toggle">
    <button id="btnEn" class="active" onclick="setLang('en')">EN</button>
    <button id="btnLo" onclick="setLang('lo')">ລາວ</button>
  </div>
</header>

<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="mainContent"></main>
</div>

) — ອອກໃນປີ 2019, ເປັນແພລດຟອມທີ່ໝັ້ນຄົງ ເຊື່ອຖືໄດ້ ແລະ ປອດໄພ ຮອງຮັບຖານຂໍ້ມູນຂະໜາດໃຫຍ່, ຄວາມປອດໄພຂັ້ນສູງ ແລະ ຫຼາຍຊະນິດຂໍ້ມູນ. ໃຊ້ໄດ້ກັບ Linux, Windows ແລະ Solaris."}}, {"type": "h", "t": {"en": "API", "lo": "API"}}, {"type": "p", "t": {"en": "REST API — an API that conforms to the REST (Representational State Transfer) architectural style, sometimes called a RESTful API.", "lo": "REST API — API ທີ່ປະຕິບັດຕາມຫຼັກການ REST (Representational State Transfer), ບາງຄັ້ງເອີ້ນວ່າ RESTful API."}}]}, {"id": "cb-portal", "icon": "ti-browser", "title": {"en": "CB Portal Overview", "lo": "ພາບລວມ CB Portal"}, "desc": {"en": "Temporary web panel for Commercial Banks", "lo": "ໜ້າເວັບຊົ່ວຄາວສຳລັບທະນາຄານທຸລະກິດ"}, "blocks": [{"type": "p", "t": {"en": "The Commercial Bank Portal (CB Portal) is a temporary web panel for a Commercial Bank to track transactions while it prepares the full API integration with the CMS (MTS).", "lo": "Commercial Bank Portal (CB Portal) ເປັນໜ້າເວັບຊົ່ວຄາວ ໃຫ້ທະນາຄານທຸລະກິດຕິດຕາມທຸລະກຳ ໃນຂະນະທີ່ກຳລັງກະກຽມການເຊື່ອມຕໍ່ API ເຕັມຮູບແບບກັບ CMS (MTS)."}}, {"type": "h", "t": {"en": "Purpose", "lo": "ຈຸດປະສົງ"}}, {"type": "list", "items": [{"en": "Track transactions for businesses registered in CMS that hold accounts with the bank.", "lo": "ຕິດຕາມທຸລະກຳຂອງທຸລະກິດທີ່ລົງທະບຽນໃນ CMS ແລະ ມີບັນຊີຢູ່ກັບທະນາຄານ."}, {"en": "Tracked data includes deposit transactions; the bank synchronizes transactions with CMS or imports a .CSV, then tracks with ACDD (synchronized from ASYCUDA).", "lo": "ຂໍ້ມູນທີ່ຕິດຕາມລວມມີທຸລະກຳເງິນຝາກ; ທະນາຄານຊິງຄ໌ທຸລະກຳກັບ CMS ຫຼື ນຳເຂົ້າ .CSV ແລ້ວຕິດຕາມກັບ ACDD (ຊິງຄ໌ມາຈາກ ASYCUDA)."}, {"en": "After tracking, the bank locks transactions per BOL policy; CMS calculates the lock value from the bank's policy.", "lo": "ຫຼັງຈາກຕິດຕາມ, ທະນາຄານລັອກທຸລະກຳຕາມນະໂຍບາຍ ທຫລ; CMS ຄຳນວນມູນຄ່າລັອກຈາກນະໂຍບາຍຂອງທະນາຄານ."}, {"en": "The bank then locks the transaction and sends the locked value (or imports .CSV) back to CMS to confirm the locked amount.", "lo": "ຈາກນັ້ນທະນາຄານລັອກທຸລະກຳ ແລະ ສົ່ງມູນຄ່າທີ່ລັອກ (ຫຼື ນຳເຂົ້າ .CSV) ກັບໄປ CMS ເພື່ອຢືນຢັນຈຳນວນທີ່ລັອກ."}, {"en": "All locked amounts must be exchanged as requested through the CMS Mobile application and processed by the CB API.", "lo": "ຈຳນວນທີ່ລັອກທັງໝົດຕ້ອງຖືກແລກປ່ຽນຕາມຄຳຮ້ອງຜ່ານແອັບ CMS Mobile ແລະ ປະມວນຜົນໂດຍ CB API."}]}, {"type": "note", "t": {"en": "Process overview steps: LOGIN → TRACKING → LOCK → EXCHANGE.", "lo": "ຂັ້ນຕອນພາບລວມ: LOGIN → TRACKING → LOCK → EXCHANGE."}}]}, {"id": "flow-overview", "icon": "ti-arrows-exchange", "title": {"en": "Semi-API Flow Overview", "lo": "ພາບລວມ Flow ຂອງ Semi-API"}, "desc": {"en": "Direction of each API between CMS Gateway and CB", "lo": "ທິດທາງຂອງແຕ່ລະ API ລະຫວ່າງ CMS Gateway ກັບ CB"}, "blocks": [{"type": "p", "t": {"en": "This is a temporary panel for the bank to track transactions while the full bank API is not yet ready. The bank synchronizes the TIN of each account from CMS, records it, then synchronizes transactions to CMS for tracking. CMS responds with lock information; the bank performs the lock and sends the locked data back.", "lo": "ນີ້ເປັນໜ້າຊົ່ວຄາວໃຫ້ທະນາຄານຕິດຕາມທຸລະກຳ ໃນຂະນະທີ່ API ເຕັມຍັງບໍ່ພ້ອມ. ທະນາຄານຊິງຄ໌ TIN ຂອງແຕ່ລະບັນຊີຈາກ CMS, ບັນທຶກໄວ້, ແລ້ວຊິງຄ໌ທຸລະກຳໄປ CMS ເພື່ອຕິດຕາມ. CMS ຕອບກັບດ້ວຍຂໍ້ມູນການລັອກ; ທະນາຄານດຳເນີນການລັອກ ແລະ ສົ່ງຂໍ້ມູນທີ່ລັອກກັບຄືນ."}}, {"type": "table", "head": [{"en": "Step", "lo": "ຂັ້ນຕອນ"}, {"en": "Direction", "lo": "ທິດທາງ"}, {"en": "API", "lo": "API"}, {"en": "Response", "lo": "ການຕອບກັບ"}], "rows": [[{"en": "1", "lo": "1"}, {"en": "CMS API Gateway → CB", "lo": "CMS API Gateway → CB"}, {"en": "Sync TIN from CMS to CB", "lo": "Sync TIN ຈາກ CMS ໄປ CB"}, {"en": "TIN Status and Bank Account", "lo": "ສະຖານະ TIN ແລະ ບັນຊີທະນາຄານ"}], [{"en": "2", "lo": "2"}, {"en": "CMS API Gateway → CB", "lo": "CMS API Gateway → CB"}, {"en": "CIF Information", "lo": "CIF Information"}, {"en": "All Bank Accounts", "lo": "ບັນຊີທະນາຄານທັງໝົດ"}], [{"en": "3", "lo": "3"}, {"en": "CMS API Gateway → CB", "lo": "CMS API Gateway → CB"}, {"en": "Sync CMS ID", "lo": "Sync CMS ID"}, {"en": "Message Result", "lo": "ຜົນລັບຂໍ້ຄວາມ"}], [{"en": "4", "lo": "4"}, {"en": "CMS API Gateway → CB", "lo": "CMS API Gateway → CB"}, {"en": "Sync Transaction", "lo": "Sync Transaction"}, {"en": "Transaction Info", "lo": "ຂໍ້ມູນທຸລະກຳ"}], [{"en": "5", "lo": "5"}, {"en": "CMS API Gateway → CB", "lo": "CMS API Gateway → CB"}, {"en": "Unlock", "lo": "Unlock"}, {"en": "Unlocked Amount Info", "lo": "ຂໍ້ມູນຈຳນວນທີ່ປົດລັອກ"}], [{"en": "6", "lo": "6"}, {"en": "CMS API Gateway → CB", "lo": "CMS API Gateway → CB"}, {"en": "Auto Exchange", "lo": "Auto Exchange"}, {"en": "Exchange Result", "lo": "ຜົນການແລກປ່ຽນ"}], [{"en": "7", "lo": "7"}, {"en": "CMS API Gateway → CB", "lo": "CMS API Gateway → CB"}, {"en": "Repay Debt", "lo": "Repay Debt"}, {"en": "Locked Amount Info", "lo": "ຂໍ້ມູນຈຳນວນທີ່ລັອກ"}]]}]}, {"id": "security", "icon": "ti-shield-lock", "title": {"en": "Security & Authentication", "lo": "ຄວາມປອດໄພ ແລະ ການຢືນຢັນຕົວຕົນ"}, "desc": {"en": "JWT authentication, credentials and access permissions", "lo": "ການຢືນຢັນ JWT, ຂໍ້ມູນປະຈຳຕົວ ແລະ ສິດການເຂົ້າເຖິງ"}, "blocks": [{"type": "h", "t": {"en": "1. Authentication Method", "lo": "1. ວິທີການຢືນຢັນຕົວຕົນ"}}, {"type": "p", "t": {"en": "The API uses JWT (JSON Web Token) for authentication. Each client is issued a unique JWT upon successful authentication, and the JWT must be included in the request header for all API calls.", "lo": "API ໃຊ້ JWT (JSON Web Token) ສຳລັບການຢືນຢັນຕົວຕົນ. ແຕ່ລະ client ຈະໄດ້ຮັບ JWT ສະເພາະ ເມື່ອຢືນຢັນສຳເລັດ ແລະ ຕ້ອງໃສ່ JWT ໃນ header ຂອງທຸກໆ API call."}}, {"type": "code", "en": "Authorization: Bearer <jwt_token>", "lo": "Authorization: Bearer <jwt_token>"}, {"type": "note", "t": {"en": "Token generation, expiration and validation details are encoded within the token and are not provided in this document.", "lo": "ລາຍລະອຽດການສ້າງ, ໝົດອາຍຸ ແລະ ການກວດສອບ token ຖືກເຂົ້າລະຫັດໄວ້ໃນ token ແລະ ບໍ່ໄດ້ລະບຸໄວ້ໃນເອກະສານນີ້."}}, {"type": "h", "t": {"en": "2. Obtaining API Credentials", "lo": "2. ການຮັບຂໍ້ມູນປະຈຳຕົວ API"}}, {"type": "p", "t": {"en": "Step 1 — Request API Credentials: Commercial Banks submit a request to the BOL team including User/Bank name, Password, Base URL (to receive data) and Login URL.", "lo": "ຂັ້ນຕອນ 1 — ຮ້ອງຂໍຂໍ້ມູນປະຈຳຕົວ API: ທະນາຄານທຸລະກິດສົ່ງຄຳຮ້ອງໄປຫາທີມ ທຫລ ໂດຍລະບຸ ຊື່ຜູ້ໃຊ້/ຊື່ທະນາຄານ, ລະຫັດຜ່ານ, Base URL (ສຳລັບຮັບຂໍ້ມູນ) ແລະ Login URL."}}, {"type": "p", "t": {"en": "Step 2 — Register an Application on the API Portal (done by BOL through the CMS BOL Portal).", "lo": "ຂັ້ນຕອນ 2 — ລົງທະບຽນແອັບພລິເຄຊັນໃນ API Portal (ດຳເນີນໂດຍ ທຫລ ຜ່ານ CMS BOL Portal)."}}, {"type": "h", "t": {"en": "3. Access Permissions", "lo": "3. ສິດການເຂົ້າເຖິງ"}}, {"type": "p", "t": {"en": "Once BOL registers the bank, credentials are issued and sent securely. Each credential has specific permissions based on the bank's role; access is restricted to authorized endpoints only.", "lo": "ເມື່ອ ທຫລ ລົງທະບຽນທະນາຄານແລ້ວ, ຂໍ້ມູນປະຈຳຕົວຈະຖືກອອກ ແລະ ສົ່ງຢ່າງປອດໄພ. ແຕ່ລະຂໍ້ມູນປະຈຳຕົວມີສິດສະເພາະຕາມບົດບາດຂອງທະນາຄານ; ການເຂົ້າເຖິງຈຳກັດສະເພາະ endpoint ທີ່ໄດ້ຮັບອະນຸຍາດເທົ່ານັ້ນ."}}]}, {"id": "errors", "icon": "ti-alert-triangle", "title": {"en": "API Error Codes", "lo": "ລະຫັດຂໍ້ຜິດພາດ API"}, "desc": {"en": "Standardized error responses", "lo": "ການຕອບກັບຂໍ້ຜິດພາດແບບມາດຕະຖານ"}, "blocks": [{"type": "p", "t": {"en": "If an API request fails, the system returns a standardized error response. The HTTP status code and the body 'code' must match.", "lo": "ຖ້າຄຳຮ້ອງ API ລົ້ມເຫລວ, ລະບົບຈະສົ່ງການຕອບກັບຂໍ້ຜິດພາດແບບມາດຕະຖານ. ລະຫັດ HTTP status ແລະ 'code' ໃນ body ຕ້ອງກົງກັນ."}}, {"type": "table", "head": [{"en": "Code", "lo": "ລະຫັດ"}, {"en": "Message", "lo": "ຂໍ້ຄວາມ"}, {"en": "Meaning", "lo": "ຄວາມໝາຍ"}], "rows": [[{"en": "400", "lo": "400"}, {"en": "Bad Request", "lo": "Bad Request"}, {"en": "Invalid request parameters", "lo": "พารามิเตอร์ຄຳຮ້ອງບໍ່ຖືກຕ້ອງ"}], [{"en": "401", "lo": "401"}, {"en": "Unauthorized", "lo": "Unauthorized"}, {"en": "Invali on (mandatory).", "lo": "ທຸກຄຳຮ້ອງຕ້ອງມີ header: Authorization (string, ບັງຄັບ) ແລະ Content-Type: application/json (ບັງຄັບ)."}}, {"type": "h", "t": {"en": "Request Body Parameters", "lo": "พารามิเตอร์ Request Body"}}, {"type": "table", "head": [{"en": "Parameter", "lo": "พารามิเตอร์"}, {"en": "M/O", "lo": "ບັງຄັບ/ບໍ່"}, {"en": "Type", "lo": "ຊະນິດ"}, {"en": "Note", "lo": "ໝາຍເຫດ"}], "rows": [[{"en": "foreignCurrency", "lo": "foreignCurrency"}, {"en": "M", "lo": "M"}, {"en": "string", "lo": "string"}, {"en": "THB, USD, LAK", "lo": "THB, USD, LAK"}]]}, {"type": "h", "t": {"en": "Request body example", "lo": "ຕົວຢ່າງ Request body"}}, {"type": "code", "en": "{\n  \"foreignCurrency\": \"USD\"\n}", "lo": "{\n  \"foreignCurrency\": \"USD\"\n}"}, {"type": "h", "t": {"en": "Response example", "lo": "ຕົວຢ່າງ Response"}}, {"type": "code", "en": "{\n  \"code\": 200,\n  \"message\": \"Success\",\n  \"data\": {\n    \"exchangeRate\": \"19811.14\",\n    \"foreignCurrency\": \"USD\"\n  }\n}", "lo": "{\n  \"code\": 200,\n  \"message\": \"Success\",\n  \"data\": {\n    \"exchangeRate\": \"19811.14\",\n    \"foreignCurrency\": \"USD\"\n  }\n}"}]}, {"id": "track-lock", "icon": "ti-lock-square", "title": {"en": "Track & Lock", "lo": "ຕິດຕາມ ແລະ ລັອກ"}, "desc": {"en": "Process flow for tracking and locking", "lo": "ຂັ້ນຕອນການຕິດຕາມ ແລະ ການລັອກ"}, "blocks": [{"type": "p", "t": {"en": "The Commercial Bank synchronizes transactions with CMS for tracking via the CB Portal. CMS then calculates the lock amount from BOL policy and sends it to the bank for locking. The bank returns the lock data to CMS.", "lo": "ທະນາຄານທຸລະກິດຊິງຄ໌ທຸລະກຳກັບ CMS ເພື່ອຕິດຕາມຜ່ານ CB Portal. ຈາກນັ້ນ CMS ຄຳນວນຈຳນວນທີ່ຈະລັອກຈາກນະໂຍບາຍ ທຫລ ແລະ ສົ່ງໃຫ້ທະນາຄານ ເພື່ອລັອກ. ທະນາຄານສົ່ງຂໍ້ມູນການລັອກກັບໄປ CMS."}}, {"type": "flow", "steps": [{"en": "Commercial Bank → CMS CB Portal: Login → Track → Lock", "lo": "ທະນາຄານທຸລະກິດ → CMS CB Portal: Login → Track → Lock"}, {"en": "Bank API ↔ CB: Request/Response Transaction Info, Post/Response Lock Info", "lo": "Bank API ↔ CB: ຄຳຮ້ອງ/ການຕອບ ຂໍ້ມູນທຸລະກຳ, ສົ່ງ/ການຕອບ ຂໍ້ມູນການລັອກ"}, {"en": "CMS Database stores the data", "lo": "ຖານຂໍ້ມູນ CMS ເກັບຂໍ້ມູນ"}]}]}, {"id": "constraints", "icon": "ti-clipboard-list", "title": {"en": "System Constraints", "lo": "ຂໍ້ຈຳກັດຂອງລະບົບ"}, "desc": {"en": "Rules and obligations for the Commercial Bank", "lo": "ກົດລະບຽບ ແລະ ໜ້າທີ່ຂອງທະນາຄານທຸລະກິດ"}, "blocks": [{"type": "list", "items": [{"en": "Transaction validation is conducted by the external Commercial Bank system ONLY.", "lo": "ການກວດສອບທຸລະກຳດຳເນີນໂດຍລະບົບທະນາຄານທຸລະກິດພາຍນອກເທົ່ານັ້ນ."}, {"en": "The bank must send real-time transactions to the CMS system.", "lo": "ທະນາຄານຕ້ອງສົ່ງທຸລະກຳແບບ real-time ໄປຫາລະບົບ CMS."}, {"en": "The bank must send locked transaction data (locked ID and locked amount) to CMS.", "lo": "ທະນາຄານຕ້ອງສົ່ງຂໍ້ມູນທຸລະກຳທີ່ລັອກ (locked ID ແລະ ຈຳນວນທີ່ລັອກ) ໄປ CMS."}, {"en": "The bank must calculate the exchange rate of each foreign currency to LAK and transmit it to CMS.", "lo": "ທະນາຄານຕ້ອງຄຳນວນອັດຕາແລກປ່ຽນຂອງແຕ່ລະສະກຸນເງິນຕ່າງປະເທດເປັນ LAK ແລະ ສົ່ງໄປ CMS."}, {"en": "The bank must freeze all transactions of each TIN until tracked to ACDD; the transaction is then available for locking.", "lo": "ທະນາຄານຕ້ອງ freeze ທຸລະກຳທັງໝົດຂອງແຕ່ລະ TIN ຈົນກວ່າຈະຕິດຕາມເຖິງ ACDD; ຈາກນັ້ນທຸລະກຳຈຶ່ງພ້ອມສຳລັບການລັອກ."}, {"en": "If a bank lacks a TIN for an account, it must set up parameters to record the TIN from CMS.", "lo": "ຖ້າທະນາຄານບໍ່ມີ TIN ສຳລັບບັນຊີ, ຕ້ອງຕັ້ງຄ່าพารามิเตอร์ເພື່ອບັນທຶກ TIN ຈາກ CMS."}, {"en": "Each account must specify a business type (export or import). If unavailable, the bank must clarify the parameter per business type.", "lo": "ແຕ່ລະບັນຊີຕ້ອງລະບຸປະເພດທຸລະກິດ (export ຫຼື import). ຖ້າບໍ່ມີ, ທະນາຄານຕ້ອງລະບຸພารามิเตอร์ຕາມແຕ່ລະປະເພດທຸລະກິດ."}, {"en": "The 'blue parameters' must be recorded in the CB database.", "lo": "'พารามิเตอร์ສີຟ້າ' ຕ້ອງຖືກບັນທຶກໄວ້ໃນຖານຂໍ້ມູນ CB."}, {"en": "All bank account details display data received from the Commercial Bank, not amounts calculated by CMS.", "lo": "ລາຍລະອຽດບັນຊີທະນາຄານທັງໝົດສະແດງຂໍ້ມູນທີ່ໄດ້ຮັບຈາກທະນາຄານທຸລະກິດ ບໍ່ແມ່ນຈຳນວນທີ່ CMS ຄຳນວນ."}, {"en": "CMS sends the unlocked amount (tracked transaction − lock amount by policy %); the bank must unlock and return the actual unlocked amount for display in the CMS app.", "lo": "CMS ສົ່ງຈຳນວນທີ່ປົດລັອກ (ທຸລະກຳທີ່ຕິດຕາມ − ຈຳນວນທີ່ລັອກຕາມ % ນະໂຍບາຍ); ທະນາຄານຕ້ອງປົດລັອກ ແລະ ສົ່ງຈຳນວນທີ່ປົດລັອກຕົວຈິງກັບໄປສະແດງໃນແອັບ CMS."}]}]}];
const UI = {"doc_title_en": "CMS Commercial Bank API — Technical Handbook", "doc_title_lo": "CMS Commercial Bank API — ຄູ່ມືທາງເຕັກນິກ", "subtitle_en": "Semi-API Development Instruction · Document #004 · v11.0", "subtitle_lo": "ຄູ່ມືພັດທະນາ Semi-API · ເອກະສານ #004 · ເວີຊັນ 11.0"};
let LANG = 'en';
let curSection = 'overview';

const STR = {
  home:{en:'Home',lo:'ໜ້າຫຼັກ'},
  overviewTitle:{en:'CMS Commercial Bank API Handbook',lo:'ຄູ່ມື CMS Commercial Bank API'},
  overviewDesc:{en:'Select a topic to read. Switch language any time with the EN / ລາວ toggle.',lo:'ເລືອກຫົວຂໍ້ເພື່ອອ່ານ. ສະຫຼັບພາສາໄດ້ທຸກເວລາດ້ວຍປຸ່ມ EN / ລາວ.'},
  searchPlaceholder:{en:'Search topics...',lo:'ຄົ້ນຫາຫົວຂໍ້...'},
  searchResults:{en:'Search results',lo:'ຜົນການຄົ້ນຫາ'},
  found:{en:'topics found',lo:'ຫົວຂໍ້ທີ່ພົບ'},
  noResults:{en:'No results — try another term',lo:'ບໍ່ພົບຜົນ — ລອງຄຳອື່ນ'},
  sections:{en:'sections',lo:'ໝວດ'},
  copy:{en:'Copy',lo:'ສຳເນົາ'},
  copied:{en:'Copied!',lo:'ສຳເນົາແລ້ວ!'},
  contents:{en:'CONTENTS',lo:'ສາລະບານ'},
};
function t(o){return (o && o[LANG]!==undefined)? o[LANG] : (o? o.en : '');}
function s(key){return STR[key][LANG];}
function esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function setLang(l){
  LANG=l;
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.getElementById('btnLo').classList.toggle('active',l==='lo');
  document.documentElement.lang = l==='lo'?'lo':'en';
  document.getElementById('docTitle').textContent = LANG==='lo'?UI.doc_title_lo:UI.doc_title_en;
  document.getElementById('docSubtitle').textContent = LANG==='lo'?UI.subtitle_lo:UI.subtitle_en;
  document.getElementById('searchInput').placeholder = s('searchPlaceholder');
  buildSidebar();
  const sv=document.getElementById('searchInput').value;
  if(sv.trim()) handleSearch(sv); else render(curSection);
}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  let h=`<div class="sidebar-label">${s('contents')}</div>`;
  h+=`<button class="nav-item ${curSection==='overview'?'active':''}" onclick="showSection('overview')">
    <i class="ti ti-home"></i>${s('home')}</button>`;
  SECTIONS.forEach(sec=>{
    h+=`<button class="nav-item ${curSection===sec.id?'active':''}" onclick="showSection('${sec.id}')">
      <i class="ti ${sec.icon}"></i>${esc(t(sec.title))}</button>`;
  });
  sb.innerHTML=h;
}

function showSection(id){
  curSection=id;
  document.getElementById('searchInput').value='';
  buildSidebar();
  render(id);
  document.getElementById('mainContent').scrollTop=0;
  document.getElementById('sidebar').classList.remove('open');
}

function renderBlock(b){
  if(b.type==='h') return `<h3 class="blk">${esc(t(b.t))}</h3>`;
  if(b.type==='p') return `<p class="blk">${esc(t(b.t))}</p>`;
  if(b.type==='note') return `<div class="note"><i class="ti ti-info-circle"></i><div>${esc(t(b.t))}</div></div>`;
  if(b.type==='list'){
    return `<ul class="blk">`+b.items.map(it=>`<li>${esc(t(it))}</li>`).join('')+`</ul>`;
  }
  if(b.type==='flow'){
    let h='<div class="flow">';
    b.steps.forEach((st,i)=>{
      if(i>0) h+='<div class="flow-arrow"><i class="ti ti-chevron-down"></i></div>';
      h+=`<div class="flow-step"><span class="flow-num">${i+1}</span><div>${esc(t(st))}</div></div>`;
    });
    return h+'</div>';
  }
  if(b.type==='table'){
    let h='<table class="tbl"><thead><tr>';
    b.head.forEach(c=>h+=`<th>${esc(t(c))}</th>`);
    h+='</tr></thead><tbody>';
    b.rows.forEach(r=>{
      h+='<tr>'+r.map(c=>`<td>${esc(t(c))}</td>`).join('')+'</tr>';
    });
    return h+'</tbody></table>';
  }
  if(b.type==='code'){
    const txt = (b[LANG]!==undefined? b[LANG] : b.en);
    return `<div class="code-wrap"><button class="copy-btn" onclick="copyCode(this)">${s('copy')}</button><pre class="code">${esc(txt)}</pre></div>`;
  }
  return '';
}

function copyCode(btn){
  const pre=btn.parentElement.querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(()=>{
    const old=btn.textContent; btn.textContent=s('copied');
    setTimeout(()=>btn.textContent=old,1400);
  });
}

function render(id){
  const main=document.getElementById('mainContent');
  if(id==='overview'){
    let h=`<div class="section-header">
      <div class="breadcrumb"><i class="ti ti-home"></i> ${s('home')}</div>
      <h2>${esc(t(STR.overviewTitle))}</h2>
      <p>${esc(t(STR.overviewDesc))}</p>
    </div><div class="overview-grid">`;
    SECTIONS.forEach(sec=>{
      h+=`<div class="ov-card" onclick="showSection('${sec.id}')">
        <div class="ov-icon"><i class="ti ${sec.icon}"></i></div>
        <h3>${esc(t(sec.title))}</h3>
        <p>${esc(t(sec.desc))}</p>
      </div>`;
    });
    main.innerHTML=h+'</div>';
    return;
  }
  const sec=SECTIONS.find(x=>x.id===id);
  if(!sec){render('overview');return;}
  let h=`<div class="section-header">
    <div class="breadcrumb"><i class="ti ti-home"></i> ${s('home')} <i class="ti ti-chevron-right"></i> ${esc(t(sec.title))}</div>
    <h2>${esc(t(sec.title))}</h2>
    <p>${esc(t(sec.desc))}</p>
  </div>`;
  h+=sec.blocks.map(renderBlock).join('');
  main.innerHTML=h;
}

function handleSearch(val){
  const main=document.getElementById('mainContent');
  if(!val.trim()){render(curSection);return;}
  const q=val.toLowerCase();
  const results=SECTIONS.filter(sec=>{
    const hay=(t(sec.title)+' '+t(sec.desc)+' '+sec.id).toLowerCase();
    return hay.includes(q);
  });
  let h=`<div class="section-header"><h2>${s('searchResults')}: "${esc(val)}"</h2><p>${results.length} ${s('found')}</p></div>`;
  h+='<div class="overview-grid">';
  results.forEach(sec=>{
    h+=`<div class="ov-card" onclick="showSection('${sec.id}')">
      <div class="ov-icon"><i class="ti ${sec.icon}"></i></div>
      <h3>${esc(t(sec.title))}</h3>
      <p>${esc(t(sec.desc))}</p>
    </div>`;
  });
  h+='</div>';
  if(!results.length) h=`<div class="section-header"><h2>${s('searchResults')}: "${esc(val)}"</h2></div><p style="color:#64748b;font-size:14px;padding:1rem">${s('noResults')}</p>`;
  main.innerHTML=h;
}

// init
setLang('en');
render('overview');
</script>
</body>
</html>
